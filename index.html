<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>가계부</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap');

  :root{
    --bg: #14151c;
    --surface: #1b1d28;
    --surface-2: #21232f;
    --border: #2c2e3d;
    --text: #ece9e1;
    --text-dim: #8d90a3;
    --gold: #c6a15b;
    --gold-dim: #9c824a;
    --income: #8fac8b;
    --expense: #b5584b;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app{
    max-width: 1180px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 28px 20px 60px;
    position: relative;
  }

  .layout{
    display: flex;
    flex-direction: column-reverse;
    gap: 32px;
  }
  .left-pane{
    width: 100%;
  }
  .center-pane{
    width: 100%;
  }
  @media (min-width: 860px){
    .layout{ flex-direction: row; align-items: flex-start; }
    .left-pane{ width: 360px; flex-shrink: 0; }
    .center-pane{ flex: 1; position: sticky; top: 24px; }
  }

  /* ---------- Header / Balance ---------- */
  .header{
    text-align: center;
    padding: 12px 0 28px;
    animation: riseIn .6s ease both;
  }
  @keyframes riseIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .label{
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }
  .balance{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 44px;
    color: var(--gold);
    letter-spacing: -0.01em;
  }
  .balance span{ font-size: 22px; color: var(--gold-dim); margin-left: 2px; }

  .stats-row{
    display: flex;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-top: 22px;
  }
  .stat{
    flex: 1;
    padding: 14px 4px;
    text-align: center;
  }
  .stat:first-child{ border-right: 1px solid var(--border); }
  .stat-label{ font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .stat-value{ font-family: 'Fraunces', serif; font-size: 19px; font-weight: 500; }
  .stat-value.income{ color: var(--income); }
  .stat-value.expense{ color: var(--expense); }

  /* ---------- Add trigger ---------- */
  .add-trigger{
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .add-trigger:hover{ border-color: var(--gold-dim); }
  .add-trigger:active{ background: var(--surface-2); }

  /* ---------- Form panel ---------- */
  .panel{
    overflow: hidden;
    max-height: 0;
    transition: max-height .35s ease;
  }
  .panel.open{ max-height: 640px; }
  .stats-collapse.open{ max-height: 900px; }
  .panel-inner{
    margin-top: 14px;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  .type-toggle{
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .type-btn{
    flex: 1;
    padding: 10px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    background: transparent;
    cursor: pointer;
    transition: all .15s ease;
  }
  .type-btn.active[data-type="expense"]{
    border-color: var(--expense);
    color: var(--expense);
    background: rgba(181,88,75,0.1);
  }
  .type-btn.active[data-type="income"]{
    border-color: var(--income);
    color: var(--income);
    background: rgba(143,172,139,0.1);
  }

  .field{ margin-bottom: 12px; }
  .field label{
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field input, .field select{
    width: 100%;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
  }
  .field input:focus, .field select:focus{
    outline: none;
    border-color: var(--gold-dim);
  }
  .field input::-webkit-calendar-picker-indicator{ filter: invert(0.6); }

  .save-btn{
    width: 100%;
    padding: 12px;
    margin-top: 4px;
    background: var(--gold);
    border: none;
    border-radius: 3px;
    color: #14151c;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .save-btn:hover{ background: #d4af6a; }

  .secondary-trigger{
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .secondary-trigger:hover{ border-color: var(--gold-dim); color: var(--gold-dim); }
  .secondary-trigger:disabled{ opacity: 0.5; cursor: default; }

  .review-panel{ margin-top: 14px; }
  .review-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 16px;
  }
  .review-title{ font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }
  .review-item{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .review-item:last-child{ border-bottom: none; }
  .review-item input[type="checkbox"]{ width: 16px; height: 16px; accent-color: var(--gold); flex-shrink: 0; margin-top: 8px; }
  .review-fields{ flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .review-row-top{ display: flex; gap: 6px; }
  .review-type-btn{
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
  }
  .review-type-btn.income{ color: var(--income); border-color: var(--income); }
  .review-type-btn.expense{ color: var(--expense); border-color: var(--expense); }
  .review-item input[type="text"], .review-item input[type="number"], .review-item input[type="date"], .review-item select{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    padding: 6px 8px;
    min-width: 0;
  }
  .review-amount{ width: 80px; }
  .review-date{ flex: 1; }
  .review-memo{ width: 100%; }
  .review-actions{ display: flex; gap: 8px; margin-top: 14px; }
  .review-actions button{ flex: 1; }
  .cancel-btn{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 12px;
    border-radius: 3px;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .loading-text{
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 14px;
  }

  /* ---------- Ledger list ---------- */
  .ledger{ margin-top: 30px; }
  .date-group{ margin-bottom: 22px; }
  .date-heading{
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
    padding-left: 2px;
  }
  .row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    animation: rowIn .3s ease both;
  }
  @keyframes rowIn{
    from{ opacity:0; transform: translateX(-4px); }
    to{ opacity:1; transform: translateX(0); }
  }
  .row-memo{
    font-size: 14px;
    color: var(--text);
  }
  .row-memo.empty{ color: var(--text-dim); font-style: italic; }
  .row-right{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .row-amount{
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
  }
  .row-amount.income{ color: var(--income); }
  .row-amount.expense{ color: var(--expense); }
  .row-del{
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    opacity: 0.45;
    padding: 2px 4px;
    transition: opacity .15s ease;
  }
  .row-del:hover{ opacity: 1; color: var(--expense); }

  .empty-state{
    text-align: center;
    padding: 50px 20px;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
  }
  .empty-state .big{
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--text);
    display: block;
    margin-bottom: 6px;
  }

  /* ---------- Selected date hint ---------- */
  .selected-date-hint{
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* ---------- Calendar ---------- */
  .cal-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
    margin-bottom: 14px;
  }
  .cal-nav{
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 32px;
    height: 32px;
    border-radius: 3px;
    font-size: 15px;
    cursor: pointer;
  }
  .cal-nav:hover{ border-color: var(--gold-dim); color: var(--gold-dim); }
  .cal-title{
    font-family: 'Fraunces', serif;
    font-size: 17px;
    color: var(--text);
  }
  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-weekday{
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    padding-bottom: 6px;
  }
  .cal-cell{
    aspect-ratio: 1 / 1.05;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 4px 3px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    overflow: hidden;
  }
  .cal-cell.empty{ border-color: transparent; }
  .cal-cell.today{ border-color: var(--gold-dim); }
  .cal-cell:not(.empty){ cursor: pointer; transition: border-color .12s ease, background .12s ease; }
  .cal-cell:not(.empty):hover{ border-color: var(--gold-dim); }
  .cal-cell.selected{ border-color: var(--gold); background: rgba(198,161,91,0.08); }

  .cal-wrap{
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .cal-wrap .cal-grid{ flex: 1; min-width: 260px; }
  .day-popup{
    width: 320px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
  }
  .day-popup-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .day-popup-title{
    font-family: 'Fraunces', serif;
    font-size: 17px;
    color: var(--gold);
  }
  .day-popup-close{
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
  }
  .day-popup-close:hover{ color: var(--gold); }
  .day-popup-list{ margin-bottom: 6px; }
  .day-popup-list .row{ padding: 10px 0; }
  .cal-daynum{ font-size: 11px; color: var(--text-dim); }
  .cal-cell.today .cal-daynum{ color: var(--gold); font-weight: 700; }
  .cal-amt{
    font-size: 8.5px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-amt.income{ color: var(--income); }
  .cal-amt.expense{ color: var(--expense); }

  /* ---------- Stats panel ---------- */
  .stats-toggle{
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
  }
  .stats-toggle:hover{ border-color: var(--gold-dim); color: var(--gold-dim); }
  .stats-panel-inner{
    margin-top: 12px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .stats-section-title{
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .cat-row{ margin-bottom: 10px; }
  .cat-row-top{
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 4px;
  }
  .cat-row-name{ color: var(--text); }
  .cat-row-value{ color: var(--text-dim); font-family: 'Fraunces', serif; }
  .cat-bar-track{
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .cat-bar-fill{ height: 100%; border-radius: 3px; }
  .cat-bar-fill.income{ background: var(--income); }
  .cat-bar-fill.expense{ background: var(--gold); }
  .insight-item{
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .insight-item b{ color: var(--gold); }
  .stats-empty{
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    padding: 10px 0;
  }

  /* ---------- Sync badge ---------- */
  .sync-badge{
    display: inline-block;
    margin: 0 auto 14px;
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-dim);
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    cursor: pointer;
  }
  .sync-badge:hover{ border-color: var(--gold-dim); color: var(--gold-dim); }

  /* ---------- Setup screen ---------- */
  .setup-screen{
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    min-height: 100%;
    background: var(--bg);
    z-index: 100;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 60px 24px 120px;
  }
  .setup-card{
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
  }
  .setup-title{
    font-family: 'Fraunces', serif;
    font-size: 20px;
    color: var(--gold);
    margin-bottom: 14px;
  }
  .setup-desc{
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .setup-error{
    background: rgba(181,88,75,0.12);
    border: 1px solid var(--expense);
    color: var(--expense);
    font-size: 12px;
    line-height: 1.6;
    padding: 10px 12px;
    border-radius: 3px;
    margin-bottom: 14px;
  }
  .setup-step textarea, .setup-step input[type="text"]{
    width: 100%;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    margin-bottom: 12px;
    resize: vertical;
  }
  .setup-actions{ display: flex; gap: 8px; }
  .setup-actions button{ flex: 1; }
</style>
</head>
<body>
<div id="app">
<div id="setupScreen" class="setup-screen">
  <div class="setup-card">
    <div class="setup-title">가계부 동기화 설정</div>
    <div class="setup-error" id="setupError" style="display:none"></div>
    <div class="setup-step" id="setupStep1">
      <p class="setup-desc">Firebase 콘솔에서 만든 프로젝트의 설정 값(firebaseConfig)을 붙여넣으세요.</p>
      <textarea id="configInput" rows="7" placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "...", ...}'></textarea>
      <button class="save-btn" id="configSaveBtn" type="button">다음</button>
    </div>
    <div class="setup-step" id="setupStep2" style="display:none">
      <p class="setup-desc">동기화 코드를 새로 만들거나, 다른 기기에서 쓰던 코드를 입력하세요. 같은 코드를 쓰는 기기끼리 기록이 실시간으로 공유돼요.</p>
      <input type="text" id="codeInput" placeholder="예: AB3F9K">
      <div class="setup-actions">
        <button class="cancel-btn" id="generateCodeBtn" type="button">코드 새로 만들기</button>
        <button class="save-btn" id="codeSaveBtn" type="button">시작하기</button>
      </div>
    </div>
  </div>
</div>

  <div class="layout">
  <div class="left-pane">
    <div class="header">
      <button class="sync-badge" id="syncBadge" type="button">동기화 설정</button>
      <div class="label">전체 잔액</div>
      <div class="balance" id="balanceEl">0<span>원</span></div>
      <div class="stats-row">
        <div class="stat">
          <div class="stat-label">이번 달 수입</div>
          <div class="stat-value income" id="monthIncomeEl">0원</div>
        </div>
        <div class="stat">
          <div class="stat-label">이번 달 지출</div>
          <div class="stat-value expense" id="monthExpenseEl">0원</div>
        </div>
      </div>
      <div class="stats-panel-inner" id="statsPanelInner" style="margin-top:16px;"></div>
      <button class="stats-toggle" id="fixedToggle" type="button">고정 수입/지출 관리</button>
      <div class="panel stats-collapse" id="fixedPanel">
        <div class="stats-panel-inner" id="fixedPanelInner"></div>
      </div>
      <button class="stats-toggle" id="catToggle" type="button">카테고리 관리</button>
      <div class="panel stats-collapse" id="catPanel">
        <div class="stats-panel-inner" id="catPanelInner"></div>
      </div>
    </div>
  </div>

  <div class="center-pane">
    <div class="cal-header">
      <button class="cal-nav" id="calPrev">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-wrap">
      <div class="cal-grid" id="calGrid"></div>
      <div class="day-popup" id="dayPopup" style="display:none">
        <div class="day-popup-header">
          <div class="day-popup-title" id="dayPopupTitle"></div>
          <button class="day-popup-close" id="dayPopupClose" type="button">×</button>
        </div>
        <div class="day-popup-list" id="dayPopupList"></div>

        <button class="add-trigger" id="addTrigger" type="button">+ 새 기록 추가</button>
        <button class="secondary-trigger" id="screenshotTrigger" type="button">스크린샷으로 인식하기</button>
        <input type="file" accept="image/*" id="screenshotInput" style="display:none">
        <div class="review-panel" id="reviewPanel"></div>

        <div class="panel" id="panel">
          <div class="panel-inner">
            <div class="type-toggle">
              <button class="type-btn active" data-type="expense" id="typeExpense">지출</button>
              <button class="type-btn" data-type="income" id="typeIncome">수입</button>
            </div>
            <div class="field">
              <label for="amountInput">금액</label>
              <input type="number" id="amountInput" placeholder="0" inputmode="numeric">
            </div>
            <div class="field">
              <label for="categoryInput">카테고리</label>
              <select id="categoryInput"></select>
            </div>
            <div class="field">
              <label for="memoInput">메모 (선택)</label>
              <input type="text" id="memoInput" placeholder="예: 점심 식사">
            </div>
            <div class="field">
              <label for="dateInput">날짜</label>
              <input type="date" id="dateInput">
            </div>
            <button class="save-btn" id="saveBtn">저장하기</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  window.addEventListener('error', function(e){

  function fileToBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // 큰 스크린샷을 적당한 크기로 줄여서 인식 성공률과 속도를 높임
  function resizeImage(file, maxWidth){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = () => { img.src = reader.result; };
      reader.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg' });
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function extractTransactions(base64, mediaType){
    const prompt = `다음은 한국 금융 앱(토스 등)의 입출금 내역 화면 캡처입니다. 오늘 날짜는 ${todayStr()}입니다. 이미지에 보이는 모든 거래 내역을 추출해서 오직 아래 JSON 배열 형식으로만 답하세요. 설명, 마크다운, 코드블록 기호는 절대 포함하지 마세요.
[{"type":"income 또는 expense","amount":숫자만,"memo":"거래 상대방 또는 내용","date":"YYYY-MM-DD 형식, 모르면 null"}]
화면에 연도가 안 보이면 오늘 날짜의 연도를 사용하세요. '오늘', '어제' 같은 표현은 오늘 날짜 기준으로 실제 날짜로 변환하세요. 입금/받음/+ 표시는 income, 출금/보냄/결제/- 표시는 expense 입니다. amount는 콤마와 원 기호를 뺀 숫자만 넣으세요. 거래 건수가 많아도 보이는 모든 항목을 빠짐없이 포함하고, memo는 15자 이내로 간단히 요약하세요.`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4096,
        messages: [
          {
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
              { type: "text", text: prompt }
            ]
          }
        ]
      })
    });
    const data = await response.json();
    const text = data.content.map(b => b.text || '').join('').trim();
    let clean = text.replace(/```json|```/g, '').trim();
    const start = clean.indexOf('[');
    const end = clean.lastIndexOf(']');
    if(start !== -1 && end !== -1 && end > start){
      clean = clean.slice(start, end + 1);
    }
    const parsed = JSON.parse(clean);
    return Array.isArray(parsed) ? parsed : [];
  }

  function normalizeYear(dateStr){
    if(!dateStr) return null;
    const m = dateStr.match(/(\d{4})[-.](\d{1,2})[-.](\d{1,2})/) || dateStr.match(/(\d{1,2})[-.](\d{1,2})/);
    if(!m) return null;
    let month, day;
    if(m.length === 4){ month = parseInt(m[2],10); day = parseInt(m[3],10); }
    else{ month = parseInt(m[1],10); day = parseInt(m[2],10); }
    if(!month || !day || month > 12 || day > 31) return null;

    const now = new Date();
    let year = now.getFullYear();
    const candidate = new Date(year, month - 1, day);
    // 캡처 화면에는 보통 연도가 안 보이므로, AI가 추측한 연도는 버리고
    // 오늘 기준 가까운 연도로 다시 맞춤 (미래로 3일 넘게 벗어나면 작년으로 처리)
    if(candidate.getTime() - now.getTime() > 3 * 24 * 60 * 60 * 1000){
      year -= 1;
    }
    return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

        return `
          <div class="row" data-id="${t.id}">
            <div class="row-memo ${t.memo ? '' : 'empty'}">${t.memo || (t.type === 'income' ? '수입' : '지출')} <span style="color:var(--text-dim);font-size:11px;">· ${cat}</span></div>
            <div class="row-right">
              <div class="row-amount ${t.type}">${sign}${fmt(t.amount)}원</div>
              <button class="row-del day-popup-del" data-id="${t.id}">×</button>
            </div>
          </div>`;
      }).join('');
      document.querySelectorAll('.day-popup-del').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.getAttribute('data-id');
          transactions = transactions.filter(t => String(t.id) !== id);
          await saveData();
          render();
          renderDayPopup();
        });
      });
    }
  }

  function fmtShort(n){
    if(n >= 10000){
      const man = n / 10000;
      return (Number.isInteger(man) ? man : man.toFixed(1)) + '만';
    }
    return fmt(n);
  }

  function renderCalendar(){
    const year = calMonth.getFullYear();
    const month = calMonth.getMonth();
    calTitle.textContent = `${year}년 ${month + 1}월`;

    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const dayTotals = {};
    transactions.forEach(t => {
      if(!dayTotals[t.date]) dayTotals[t.date] = { income: 0, expense: 0 };
      if(t.type === 'income') dayTotals[t.date].income += t.amount;
      else dayTotals[t.date].expense += t.amount;
    });

    const weekdays = ['일','월','화','수','목','금','토'];
    let html = weekdays.map(w => `<div class="cal-weekday">${w}</div>`).join('');

    for(let i = 0; i < firstWeekday; i++){
      html += `<div class="cal-cell empty"></div>`;
    }

    for(let d = 1; d <= daysInMonth; d++){
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const totals = dayTotals[dateStr];
      let amtHtml = '';
      if(totals){
        if(totals.income > 0) amtHtml += `<div class="cal-amt income">+${fmtShort(totals.income)}</div>`;
        if(totals.expense > 0) amtHtml += `<div class="cal-amt expense">-${fmtShort(totals.expense)}</div>`;
      }
      const isToday = dateStr === todayStr();
      const isSelected = dateStr === selectedDate;
      html += `<div class="cal-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-date="${dateStr}"><div class="cal-daynum">${d}</div>${amtHtml}</div>`;
    }

    calGrid.innerHTML = html;

    document.querySelectorAll('.cal-cell[data-date]').forEach(cell => {
      cell.addEventListener('click', () => selectDate(cell.getAttribute('data-date')));
    });

    renderStats();
    if(selectedDate && dayPopup.style.display !== 'none') renderDayPopup();
  }

  function renderStats(){
    const year = calMonth.getFullYear();
    const month = calMonth.getMonth();
    const monthTx = transactions.filter(t => {
      const d = new Date(t.date + 'T00:00:00');
      return d.getFullYear() === year && d.getMonth() === month;
    });

    const incomeByCat = {};
    const expenseByCat = {};
    let totalIncome = 0, totalExpense = 0;
    monthTx.forEach(t => {
      const cat = t.category || (t.type === 'income' ? '기타수입' : '기타');
      if(t.type === 'income'){
        incomeByCat[cat] = (incomeByCat[cat] || 0) + t.amount;
        totalIncome += t.amount;
      }else{
        expenseByCat[cat] = (expenseByCat[cat] || 0) + t.amount;
        totalExpense += t.amount;
      }
    });

    function buildRows(byCat, total, cls){
      const entries = Object.entries(byCat).sort((a,b) => b[1] - a[1]);
      if(entries.length === 0) return `<div class="stats-empty">이번 달 기록이 없어요</div>`;
      return entries.map(([cat, amt]) => {
        const pct = total > 0 ? Math.round((amt / total) * 1000) / 10 : 0;
        return `
          <div class="cat-row">
            <div class="cat-row-top">
              <span class="cat-row-name">${cat}</span>
              <span class="cat-row-value">${fmt(amt)}원 · ${pct}%</span>
            </div>
            <div class="cat-bar-track"><div class="cat-bar-fill ${cls}" style="width:${pct}%"></div></div>
          </div>`;
      }).join('');
    }

    const insights = [];
    const expenseEntries = Object.entries(expenseByCat).sort((a,b) => b[1] - a[1]);
    if(totalExpense > 0 && expenseEntries.length > 0){
      const [topCat, topAmt] = expenseEntries[0];
      const topPct = Math.round((topAmt / totalExpense) * 1000) / 10;
      if(topPct >= 25){
        insights.push(`<b>${topCat}</b> 지출이 이번 달 전체 지출의 <b>${topPct}%</b>를 차지해요. 여기를 줄이면 가장 큰 절약 효과를 볼 수 있어요.`);
      }
      const transportEntry = expenseByCat['교통'];
      if(transportEntry){
        const tPct = Math.round((transportEntry / totalExpense) * 1000) / 10;
        if(tPct >= 15) insights.push(`교통비가 <b>${tPct}%</b>로 꽤 높아요. 택시 대신 대중교통을 늘리면 아낄 수 있어요.`);
      }
      const subEntry = expenseByCat['구독/디지털'];
      if(subEntry){
        const sPct = Math.round((subEntry / totalExpense) * 1000) / 10;
        if(sPct >= 8) insights.push(`구독/디지털 지출이 <b>${sPct}%</b>예요. 안 쓰는 구독이 있는지 한번 점검해보세요.`);
      }
      const foodEntry = expenseByCat['식비'];
      if(foodEntry){
        const fPct = Math.round((foodEntry / totalExpense) * 1000) / 10;
        if(fPct >= 35) insights.push(`식비가 <b>${fPct}%</b>로 지출의 큰 부분을 차지해요. 외식/배달 빈도를 줄이면 도움이 될 거예요.`);
      }
    }
    if(insights.length === 0 && totalExpense > 0){
      insights.push('특별히 눈에 튀는 지출 항목은 없어요. 골고루 잘 관리되고 있어요.');
    }

    const fixedIncomeTotal = fixedItems.filter(f => f.type === 'income').reduce((s,f) => s + f.amount, 0);
    const fixedExpenseTotal = fixedItems.filter(f => f.type === 'expense').reduce((s,f) => s + f.amount, 0);
    const fixedNote = fixedItems.length > 0
      ? `<div class="insight-item">참고로 등록해두신 <b>고정 수입 ${fmt(fixedIncomeTotal)}원</b>, <b>고정 지출 ${fmt(fixedExpenseTotal)}원</b>이 있어요. 위 통계는 실제 기록된 내역만 반영된 거라, 아직 안 찍힌 고정 항목이 있다면 참고해서 비교해보세요.</div>`
      : '';

    statsPanelInner.innerHTML = `
      <div class="stats-section-title">${year}년 ${month+1}월 수입 (총 ${fmt(totalIncome)}원)</div>
      ${buildRows(incomeByCat, totalIncome, 'income')}
      <div class="stats-section-title" style="margin-top:16px;">${year}년 ${month+1}월 지출 (총 ${fmt(totalExpense)}원)</div>
      ${buildRows(expenseByCat, totalExpense, 'expense')}
      ${insights.map(i => `<div class="insight-item">${i}</div>`).join('')}
      ${fixedNote}
    `;
  }

  fixedToggle.addEventListener('click', () => {
    fixedPanel.classList.toggle('open');
    if(fixedPanel.classList.contains('open')) renderFixed();
  });

  function renderFixed(){
    const catOptions = categoryOptionsFor(fixedType).map(c => `<option value="${c}">${c}</option>`).join('');
    const incomeItems = fixedItems.filter(f => f.type === 'income');
    const expenseItems = fixedItems.filter(f => f.type === 'expense');
    const totalIncome = incomeItems.reduce((s,f) => s + f.amount, 0);
    const totalExpense = expenseItems.reduce((s,f) => s + f.amount, 0);

    function listHtml(items){
      if(items.length === 0) return `<div class="stats-empty">등록된 항목이 없어요</div>`;
      return items.map(f => `
        <div class="row">
          <div class="row-memo ${f.memo ? '' : 'empty'}">${f.memo || f.category} <span style="color:var(--text-dim);font-size:11px;">· ${f.category}</span></div>
          <div class="row-right">
            <div class="row-amount ${f.type}">${fmt(f.amount)}원</div>
            <button class="row-del fixed-del" data-id="${f.id}">×</button>
          </div>
        </div>`).join('');
    }

    fixedPanelInner.innerHTML = `
      <div class="type-toggle">
        <button class="type-btn ${fixedType === 'expense' ? 'active' : ''}" id="fixedTypeExpense" type="button">지출</button>
        <button class="type-btn ${fixedType === 'income' ? 'active' : ''}" id="fixedTypeIncome" type="button">수입</button>
      </div>
      <div class="field"><label for="fixedAmountInput">금액</label><input type="number" id="fixedAmountInput" placeholder="0" inputmode="numeric"></div>
      <div class="field"><label for="fixedCategoryInput">카테고리</label><select id="fixedCategoryInput">${catOptions}</select></div>
      <div class="field"><label for="fixedMemoInput">메모 (선택)</label><input type="text" id="fixedMemoInput" placeholder="예: 월세, 넷플릭스, 월급"></div>
      <button class="save-btn" id="fixedAddBtn" type="button">고정 항목 추가</button>
      <div class="stats-section-title" style="margin-top:18px;">고정 수입 (합계 ${fmt(totalIncome)}원)</div>
      ${listHtml(incomeItems)}
      <div class="stats-section-title" style="margin-top:16px;">고정 지출 (합계 ${fmt(totalExpense)}원)</div>
      ${listHtml(expenseItems)}
    `;

    document.getElementById('fixedTypeExpense').addEventListener('click', () => { fixedType = 'expense'; renderFixed(); });
    document.getElementById('fixedTypeIncome').addEventListener('click', () => { fixedType = 'income'; renderFixed(); });
    document.getElementById('fixedAddBtn').addEventListener('click', async () => {
      const amountEl = document.getElementById('fixedAmountInput');
      const amount = parseFloat(amountEl.value);
      if(!amount || amount <= 0){
        amountEl.focus();
        return;
      }
      const category = document.getElementById('fixedCategoryInput').value;
      const memo = document.getElementById('fixedMemoInput').value.trim();
      fixedItems.push({ id: Date.now(), type: fixedType, amount, category, memo });
      await saveData();
      renderFixed();
    });
    document.querySelectorAll('.fixed-del').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.getAttribute('data-id');
        fixedItems = fixedItems.filter(f => String(f.id) !== id);
        await saveData();
        renderFixed();
      });
    });
  }

  catToggle.addEventListener('click', () => {
    catPanel.classList.toggle('open');
    if(catPanel.classList.contains('open')) renderCategoryManager();
  });

  function renderCategoryManager(){
    const list = categories[catManageType];

    function listHtml(){
      if(list.length === 0) return `<div class="stats-empty">등록된 카테고리가 없어요</div>`;
      return list.map((c, i) => `
        <div class="row">
          <div class="row-memo">${c}</div>
          <div class="row-right">
            <button class="row-del cat-del" data-index="${i}">×</button>
          </div>
        </div>`).join('');
    }

    catPanelInner.innerHTML = `
      <div class="type-toggle">
        <button class="type-btn ${catManageType === 'expense' ? 'active' : ''}" id="catTypeExpense" type="button">지출 카테고리</button>
        <button class="type-btn ${catManageType === 'income' ? 'active' : ''}" id="catTypeIncome" type="button">수입 카테고리</button>
      </div>
      <div class="field">
        <label for="newCatInput">새 카테고리 이름</label>
        <input type="text" id="newCatInput" placeholder="예: 여행, 반려동물">
      </div>
      <button class="save-btn" id="addCatBtn" type="button">카테고리 추가</button>
      <div class="stats-section-title" style="margin-top:18px;">현재 ${catManageType === 'expense' ? '지출' : '수입'} 카테고리</div>
      ${listHtml()}
    `;

    document.getElementById('catTypeExpense').addEventListener('click', () => { catManageType = 'expense'; renderCategoryManager(); });
    document.getElementById('catTypeIncome').addEventListener('click', () => { catManageType = 'income'; renderCategoryManager(); });

    document.getElementById('addCatBtn').addEventListener('click', async () => {
      const input = document.getElementById('newCatInput');
      const name = input.value.trim();
      if(!name) { input.focus(); return; }
      if(categories[catManageType].includes(name)){
        input.focus();
        return;
      }
      categories[catManageType].push(name);
      await saveData();
      updateCategoryOptions();
      renderCategoryManager();
    });

    document.querySelectorAll('.cat-del').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const idx = parseInt(e.target.getAttribute('data-index'), 10);
        if(categories[catManageType].length <= 1) return;
        categories[catManageType].splice(idx, 1);
        await saveData();
        updateCategoryOptions();
        renderCategoryManager();
      });
    });
  }

  if(lsGet(LS_CONFIG_KEY) && lsGet(LS_CODE_KEY)){
    setupScreen.style.display = 'none';
    startSync();
  }else{
    render();
    openSetup();
  }
</script>
</body>
</html>
